<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭記帳">
<meta name="theme-color" content="#ffffff">
<title>家庭記帳</title>
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg:      #f5f4f0;
  --surface: #ffffff;
  --border:  rgba(0,0,0,0.08);
  --text1:   #1a1a1a;
  --text2:   #666;
  --text3:   #aaa;
  --blue:    #3266ad;
  --green:   #3b6d11;
  --red:     #a32d2d;
  --radius:  12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #111;
    --surface: #1e1e1e;
    --border:  rgba(255,255,255,0.1);
    --text1:   #f0f0f0;
    --text2:   #999;
    --text3:   #555;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text1); max-width: 430px; margin: 0 auto; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }

/* ── Top Bar ── */
.topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 14px 16px 0; position: sticky; top: 0; z-index: 50; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; }
.nav-group { display: flex; align-items: center; gap: 8px; }
.nav-btn { background: none; border: 0.5px solid var(--border); border-radius: 8px; padding: 5px 12px; font-size: 14px; color: var(--text2); }
.month-lbl { font-size: 16px; font-weight: 600; min-width: 88px; text-align: center; }
.add-btn { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
.tabs { display: flex; }
.tab { flex: 1; text-align: center; padding: 8px 0 10px; font-size: 13px; color: var(--text3); border-bottom: 2px solid transparent; }
.tab.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

/* ── Content ── */
.section { padding: 14px 16px; }

/* ── Metric cards ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.metric { background: var(--surface); border-radius: var(--radius); padding: 13px 15px; border: 0.5px solid var(--border); }
.metric-lbl { font-size: 11px; color: var(--text3); margin-bottom: 5px; }
.metric-val { font-size: 18px; font-weight: 700; }
.c-inc { color: #185fa5; } .c-exp { color: var(--red); }
.c-pos { color: var(--green); } .c-neg { color: var(--red); }
.c-neutral { color: var(--text1); }

/* ── Card ── */
.card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; border: 0.5px solid var(--border); }
.card-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; }

/* ── Legend ── */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Chart ── */
.chart-wrap { position: relative; width: 100%; height: 200px; }

/* ── Transaction ── */
.txn-list { display: flex; flex-direction: column; gap: 7px; }
.txn { display: flex; align-items: center; gap: 11px; padding: 10px 14px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); }
.txn-ico { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
.txn-info { flex: 1; min-width: 0; }
.txn-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.txn-amt { font-size: 13px; font-weight: 700; flex-shrink: 0; }
.txn-del { background: none; border: none; color: var(--text3); font-size: 18px; padding: 0 2px; flex-shrink: 0; }

/* ── Filter / search ── */
.search-row { margin-bottom: 10px; }
.search-row input { width: 100%; border: 0.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; background: var(--surface); color: var(--text1); }
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { padding: 4px 11px; border: 0.5px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text2); background: none; }
.chip.on { background: #e6f1fb; border-color: var(--blue); color: #0c447c; font-weight: 600; }

/* ── Daily bars ── */
.daily-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.day-lbl { font-size: 11px; color: var(--text3); width: 30px; text-align: right; flex-shrink: 0; }
.bar-wrap { flex: 1; height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--blue); border-radius: 4px; }
.day-val { font-size: 11px; color: var(--text2); width: 62px; text-align: right; flex-shrink: 0; }

/* ── Fixed items ── */
.rec-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.rec-row:last-child { border-bottom: none; }
.rec-left { display: flex; align-items: center; gap: 10px; }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.rec-name { font-size: 13px; }
.rec-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.rec-right { display: flex; align-items: center; gap: 8px; }
.rec-amt { font-size: 13px; font-weight: 700; }

/* ── Modal ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
.overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 18px 18px 0 0; padding: 20px 20px calc(20px + var(--safe-bottom)); width: 100%; max-width: 430px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.close-x { float: right; background: none; border: none; font-size: 22px; color: var(--text3); line-height: 1; margin-top: -2px; }
.type-row { display: flex; gap: 8px; margin-bottom: 14px; }
.type-btn { flex: 1; padding: 8px; border: 0.5px solid var(--border); border-radius: 10px; background: none; font-size: 14px; color: var(--text2); }
.type-btn.ae { background: #fcebeb; border-color: var(--red); color: #791f1f; font-weight: 600; }
.type-btn.ai { background: #eaf3de; border-color: var(--green); color: #27500a; font-weight: 600; }
.flabel { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; margin-top: 12px; }
.finput { width: 100%; border: 0.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 15px; background: var(--surface); color: var(--text1); }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
.cat-btn { padding: 8px 4px; border: 0.5px solid var(--border); border-radius: 10px; background: none; font-size: 11px; color: var(--text2); text-align: center; line-height: 1.4; }
.cat-btn.on { border-color: var(--blue); background: #e6f1fb; color: #0c447c; font-weight: 600; }
.save-btn { width: 100%; padding: 13px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; margin-top: 16px; }
.save-btn:disabled { opacity: 0.5; }
.ghost-btn { width: 100%; padding: 12px; background: var(--bg); color: var(--text1); border: 0.5px solid var(--border); border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 10px; }
select.finput { appearance: none; }

/* ── Sync status ── */
.sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.sync-ok { background: var(--green); }
.sync-err { background: var(--red); }
.sync-ing { background: #f5a623; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.sync-bar { font-size: 11px; color: var(--text3); padding: 4px 16px 8px; display: flex; align-items: center; }

/* ── Empty / loading ── */
.empty { text-align: center; color: var(--text3); font-size: 13px; padding: 20px 0; }
.loading { text-align: center; color: var(--text3); font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-row">
    <div class="nav-group">
      <button class="nav-btn" onclick="chgM(-1)">◀</button>
      <span class="month-lbl" id="ml"></span>
      <button class="nav-btn" onclick="chgM(1)">▶</button>
    </div>
    <button class="add-btn" onclick="openAdd()">＋ 新增</button>
  </div>
  <div id="sync-bar" class="sync-bar"><span class="sync-dot sync-ok" id="sd"></span><span id="st">已連線 Google Sheets</span></div>
  <div class="tabs">
    <div class="tab on" onclick="sw(0,this)">總覽</div>
    <div class="tab" onclick="sw(1,this)">明細</div>
    <div class="tab" onclick="sw(2,this)">趨勢</div>
    <div class="tab" onclick="sw(3,this)">固定</div>
  </div>
</div>

<!-- Tab content -->
<div id="t0" class="section"></div>
<div id="t1" class="section" style="display:none"></div>
<div id="t2" class="section" style="display:none"></div>
<div id="t3" class="section" style="display:none"></div>

<!-- Modal -->
<div class="overlay" id="ov"><div class="modal" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// 設定區 — 部署後把這裡換成你的 Apps Script 網址
// ═══════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbzNagEFhYHcnVT4TiO-7MTTY_RJeuRsFFgnQ9OUGgJmFdqdt4zoysFRrQeLfaoqHg4_lw/exec';
// ═══════════════════════════════════════════════

const EXP_CATS = [
  {n:'伙食費',e:'🍱'},{n:'買菜費用',e:'🛒'},{n:'日用雜貨',e:'🧴'},
  {n:'教育教養費',e:'📚'},{n:'治裝費',e:'👔'},{n:'醫療費',e:'🏥'},
  {n:'美髮費',e:'💇'},{n:'交通費',e:'🚌'},{n:'清潔費',e:'🧹'},
  {n:'喜慶交際費',e:'🎉'},{n:'保險費',e:'🛡'},{n:'稅金',e:'📋'},{n:'其他支出',e:'📦'}
];
const INC_CATS = [
  {n:'薪水（夫）',e:'💼'},{n:'薪水（妻）',e:'💼'},{n:'年終獎金',e:'🎯'},
  {n:'其他獎金',e:'🎖'},{n:'傷病補貼',e:'🏥'},{n:'發票中獎',e:'🎟'},
  {n:'政府津貼',e:'🏛'},{n:'保險賠付',e:'🛡'},{n:'租金',e:'🏠'},{n:'其他收入',e:'💰'}
];
const CAT_COLOR = {
  '伙食費':'#e24b4a','買菜費用':'#ba7517','日用雜貨':'#d4537e','教育教養費':'#639922',
  '治裝費':'#7f77dd','醫療費':'#1d9e75','美髮費':'#5dcaa5','交通費':'#378add',
  '清潔費':'#888780','喜慶交際費':'#d85a30','保險費':'#0f6e56','稅金':'#533ab7','其他支出':'#3c3489',
  '薪水（夫）':'#185fa5','薪水（妻）':'#3b6d11','年終獎金':'#ba7517','其他獎金':'#854f0b',
  '傷病補貼':'#1d9e75','發票中獎':'#d4537e','政府津貼':'#533ab7','保險賠付':'#0f6e56',
  '租金':'#5dcaa5','其他收入':'#888780'
};

// State
let recs = [], fixeds = [], curM = new Date(), tab = 0;
let pieC = null, barC = null;
let eType = 'expense', eCat = '', rType = 'expense';
let synced = false;

// ── API ────────────────────────────────────────
function syncStatus(state, msg) {
  const dot = document.getElementById('sd'), st = document.getElementById('st');
  dot.className = 'sync-dot ' + (state==='ok'?'sync-ok':state==='err'?'sync-err':'sync-ing');
  st.textContent = msg;
}

async function api(action, data={}) {
  const isGet = ['getRecords','getFixed'].includes(action);
  let url = API_URL + '?action=' + action;
  if (isGet && data.month) url += '&month=' + data.month;
  try {
    const res = await fetch(isGet ? url : url, {
      method: isGet ? 'GET' : 'POST',
      headers: isGet ? {} : {'Content-Type':'application/json'},
      body: isGet ? undefined : JSON.stringify({action, ...data})
    });
    const json = await res.json();
    return json;
  } catch(e) {
    syncStatus('err', '連線失敗，使用本機快取');
    throw e;
  }
}

async function loadMonth() {
  const m = mk(curM);
  syncStatus('ing', '載入中…');
  try {
    recs = await api('getRecords', {month: m});
    fixeds = await api('getFixed');
    syncStatus('ok', '已同步 Google Sheets');
    synced = true;
  } catch(e) {
    // fallback to localStorage
    recs = JSON.parse(localStorage.getItem('recs_'+m)||'[]');
    fixeds = JSON.parse(localStorage.getItem('fixeds')||'[]');
  }
  renderAll();
}

// ── Utils ──────────────────────────────────────
function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function fmt(n){return 'NT$'+Math.round(n).toLocaleString();}
function mRecs(){const m=mk(curM);return recs.filter(r=>String(r.date).startsWith(m));}

function chgM(d){
  curM = new Date(curM.getFullYear(), curM.getMonth()+d, 1);
  loadMonth();
}

function sw(i, el){
  tab = i;
  [0,1,2,3].forEach(j=>{
    document.getElementById('t'+j).style.display = j===i ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((t,j)=>{
    t.className = 'tab' + (j===i?' on':'');
  });
  renderAll();
}

function renderAll(){
  document.getElementById('ml').textContent = curM.getFullYear()+'年'+(curM.getMonth()+1)+'月';
  if(tab===0) r0();
  if(tab===1) r1();
  if(tab===2) r2();
  if(tab===3) r3();
}

function txnRow(r, showDel=false){
  const cats = r.type==='income'?INC_CATS:EXP_CATS;
  const cat = cats.find(c=>c.n===r.cat)||{e:'•'};
  const c = CAT_COLOR[r.cat]||'#888';
  const sign = r.type==='income'?'+':'-';
  const cls = r.type==='income'?'c-pos':'c-exp';
  return `<div class="txn">
    <div class="txn-ico" style="background:${c}22">${cat.e}</div>
    <div class="txn-info">
      <div class="txn-name">${r.cat}</div>
      <div class="txn-meta">${String(r.date).slice(5)} · ${r.note||'—'}</div>
    </div>
    <div class="txn-amt ${cls}">${sign}${fmt(r.amount)}</div>
    ${showDel?`<button class="txn-del" onclick="doDelRec('${r.id}')">×</button>`:''}
  </div>`;
}

// ── Tab 0: Overview ────────────────────────────
function r0(){
  const rs = mRecs();
  const inc = rs.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0);
  const exp = rs.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);
  const bal = inc - exp;
  const cm = {};
  rs.filter(r=>r.type==='expense').forEach(r=>{ cm[r.cat]=(cm[r.cat]||0)+Number(r.amount); });
  const cats = Object.keys(cm).sort((a,b)=>cm[b]-cm[a]);
  const colors = cats.map(c=>CAT_COLOR[c]||'#888');
  const total = cats.reduce((s,c)=>s+cm[c],0);

  const recent = rs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);

  document.getElementById('t0').innerHTML = `
    <div class="grid2">
      <div class="metric"><div class="metric-lbl">本月收入</div><div class="metric-val c-inc">${fmt(inc)}</div></div>
      <div class="metric"><div class="metric-lbl">本月支出</div><div class="metric-val c-exp">${fmt(exp)}</div></div>
      <div class="metric"><div class="metric-lbl">結餘</div><div class="metric-val ${bal>=0?'c-pos':'c-neg'}">${fmt(bal)}</div></div>
      <div class="metric"><div class="metric-lbl">記錄筆數</div><div class="metric-val c-neutral" style="font-size:15px">${rs.length} 筆</div></div>
    </div>
    <div class="card">
      <div class="card-title">支出分類</div>
      <div class="legend">${cats.map((c,i)=>`<span class="leg"><span class="leg-dot" style="background:${colors[i]}"></span>${c} ${total?Math.round(cm[c]/total*100):0}%</span>`).join('')||'<span style="color:var(--text3);font-size:12px">本月尚無支出</span>'}</div>
      <div class="chart-wrap"><canvas id="pieC" role="img" aria-label="支出分類圓餅圖">無資料</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">最近記錄</div>
      <div class="txn-list">${recent.length ? recent.map(r=>txnRow(r)).join('') : '<div class="empty">本月尚無記錄</div>'}</div>
    </div>`;

  if(pieC) pieC.destroy();
  const ctx = document.getElementById('pieC').getContext('2d');
  if(cats.length){
    pieC = new Chart(ctx,{type:'doughnut',data:{labels:cats,datasets:[{data:cats.map(c=>cm[c]),backgroundColor:colors,borderWidth:1,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+fmt(c.raw)}}}}});
  } else {
    ctx.clearRect(0,0,300,200);
    ctx.fillStyle='#aaa'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('本月尚無支出記錄',150,105);
  }
}

// ── Tab 1: Detail ──────────────────────────────
let activeChips = [];
function r1(){
  const rs = mRecs();
  const q = document.querySelector('#srch')?.value||'';
  const allCats = [...new Set(rs.map(r=>r.cat))];
  let filtered = rs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(activeChips.length) filtered = filtered.filter(r=>activeChips.includes(r.cat));
  if(q) filtered = filtered.filter(r=>(r.note+r.cat).includes(q));

  const chips = ['全部',...allCats].map(c=>{
    const on = (!activeChips.length&&c==='全部')||activeChips.includes(c);
    return `<button class="chip${on?' on':''}" onclick="togChip('${c}')">${c}</button>`;
  }).join('');

  document.getElementById('t1').innerHTML = `
    <div class="search-row"><input type="text" id="srch" placeholder="搜尋類別、備註…" oninput="r1()" value="${q}"></div>
    <div class="filter-row">${chips}</div>
    <div class="txn-list">${filtered.length ? filtered.map(r=>txnRow(r,true)).join('') : '<div class="empty">無符合記錄</div>'}</div>`;
}

function togChip(c){
  if(c==='全部'){ activeChips=[];}
  else {
    const i = activeChips.indexOf(c);
    if(i>=0) activeChips.splice(i,1); else activeChips.push(c);
  }
  r1();
}

async function doDelRec(id){
  if(!confirm('確定刪除這筆記錄？')) return;
  try {
    await api('delRecord', {id});
    recs = recs.filter(r=>String(r.id)!==String(id));
  } catch(e) {
    recs = recs.filter(r=>String(r.id)!==String(id));
  }
  r1();
}

// ── Tab 2: Trend ───────────────────────────────
function r2(){
  const rs = mRecs();
  const days = new Date(curM.getFullYear(), curM.getMonth()+1, 0).getDate();
  const dayE = Array(days).fill(0), dayI = Array(days).fill(0);
  rs.forEach(r=>{
    const d = parseInt(String(r.date).split('-')[2])-1;
    if(d>=0&&d<days){ if(r.type==='expense') dayE[d]+=Number(r.amount); else dayI[d]+=Number(r.amount); }
  });
  const maxE = Math.max(...dayE, 1);
  const rows = dayE.map((v,i)=>({v,inc:dayI[i],i})).filter(x=>x.v>0||x.inc>0);

  document.getElementById('t2').innerHTML = `
    <div class="card">
      <div class="card-title">每日收支概況</div>
      <div style="display:flex;gap:14px;margin-bottom:8px;font-size:12px;color:var(--text2)">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#e24b4a;margin-right:4px"></span>支出</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b6d11;margin-right:4px"></span>收入</span>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="barC" role="img" aria-label="每日收支圖">每日收支</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">有消費的日子</div>
      ${rows.length ? rows.map(x=>`
        <div class="daily-row">
          <span class="day-lbl">${x.i+1}日</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(x.v/maxE*100)}%"></div></div>
          <span class="day-val">${x.v?fmt(x.v):''}</span>
        </div>`).join('') : '<div class="empty">本月尚無資料</div>'}
    </div>`;

  if(barC) barC.destroy();
  const ctx = document.getElementById('barC').getContext('2d');
  barC = new Chart(ctx,{type:'bar',data:{labels:Array.from({length:days},(_,i)=>i+1+''),datasets:[
    {label:'支出',data:dayE,backgroundColor:'#e24b4a88',borderColor:'#e24b4a',borderWidth:1},
    {label:'收入',data:dayI,backgroundColor:'#3b6d1188',borderColor:'#3b6d11',borderWidth:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},scales:{x:{ticks:{autoSkip:true,maxRotation:0,font:{size:9}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k'}}}}});
}

// ── Tab 3: Fixed ───────────────────────────────
function r3(){
  document.getElementById('t3').innerHTML = `
    <div class="card">
      <div class="card-title">固定收支項目</div>
      ${fixeds.length ? fixeds.slice().sort((a,b)=>a.day-b.day).map(f=>{
        const c = f.type==='income'?'#3b6d11':'#a32d2d';
        return `<div class="rec-row">
          <div class="rec-left"><div class="rec-dot" style="background:${c}"></div>
            <div><div class="rec-name">${f.name}</div><div class="rec-sub">每月 ${f.day} 日 · ${f.cat}</div></div>
          </div>
          <div class="rec-right">
            <div class="rec-amt" style="color:${c}">${f.type==='income'?'+':'-'}${fmt(f.amount)}</div>
            <button class="txn-del" onclick="doDelFixed('${f.id}')">×</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty">尚無固定項目</div>'}
    </div>
    <button class="ghost-btn" onclick="openFixed()">＋ 新增固定項目</button>`;
}

async function doDelFixed(id){
  if(!confirm('確定刪除此固定項目？')) return;
  try { await api('delFixed', {id}); } catch(e) {}
  fixeds = fixeds.filter(f=>String(f.id)!==String(id));
  r3();
}

// ── Add Record Modal ───────────────────────────
function openAdd(){
  eType='expense'; eCat='';
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('mbox').innerHTML = `
    <button class="close-x" onclick="closeOv()">×</button>
    <div class="modal-title">新增記錄</div>
    <div class="type-row">
      <button class="type-btn ae" id="be" onclick="setET('expense')">支出</button>
      <button class="type-btn" id="bi" onclick="setET('income')">收入</button>
    </div>
    <label class="flabel">金額（NT$）</label>
    <input class="finput" type="number" id="fa" placeholder="0" min="0" inputmode="numeric">
    <label class="flabel">類別</label>
    <div class="cat-grid" id="cg">${buildCatBtns('expense')}</div>
    <label class="flabel">日期</label>
    <input class="finput" type="date" id="fd" value="${today}">
    <label class="flabel">備註（可加 #標籤）</label>
    <input class="finput" type="text" id="fn" placeholder="例：午餐 #外食">
    <button class="save-btn" onclick="saveRec()">儲存</button>`;
  document.getElementById('ov').classList.add('show');
}

function buildCatBtns(type){
  return (type==='expense'?EXP_CATS:INC_CATS).map(c=>
    `<button class="cat-btn${c.n===eCat?' on':''}" onclick="pickCat('${c.n}')">${c.e}<br>${c.n}</button>`
  ).join('');
}

function setET(t){
  eType=t; eCat='';
  document.getElementById('be').className='type-btn'+(t==='expense'?' ae':'');
  document.getElementById('bi').className='type-btn'+(t==='income'?' ai':'');
  document.getElementById('cg').innerHTML=buildCatBtns(t);
}
function pickCat(n){ eCat=n; document.getElementById('cg').innerHTML=buildCatBtns(eType); }

async function saveRec(){
  const amt = parseFloat(document.getElementById('fa').value);
  const date = document.getElementById('fd').value;
  const note = document.getElementById('fn').value.trim();
  if(!amt||!date||!eCat){ alert('請填入金額、日期並選擇類別'); return; }
  const rec = {date, type:eType, cat:eCat, amount:amt, note};
  syncStatus('ing','儲存中…');
  try {
    const res = await api('addRecord', {record:rec});
    rec.id = res.id;
    syncStatus('ok','已同步 Google Sheets');
  } catch(e) {
    rec.id = Date.now().toString();
    syncStatus('err','已存本機，稍後同步');
  }
  const m = mk(curM);
  if(String(rec.date).startsWith(m)) recs.unshift(rec);
  localStorage.setItem('recs_'+m, JSON.stringify(recs));
  closeOv(); renderAll();
}

// ── Add Fixed Modal ────────────────────────────
function openFixed(){
  rType='expense';
  document.getElementById('mbox').innerHTML = `
    <button class="close-x" onclick="closeOv()">×</button>
    <div class="modal-title">新增固定項目</div>
    <div class="type-row">
      <button class="type-btn ae" id="rbe" onclick="setRT('expense')">固定支出</button>
      <button class="type-btn" id="rbi" onclick="setRT('income')">固定收入</button>
    </div>
    <label class="flabel">項目名稱</label>
    <input class="finput" type="text" id="rn" placeholder="例：房租、保險費、薪水">
    <label class="flabel">金額（NT$）</label>
    <input class="finput" type="number" id="ra" placeholder="0" inputmode="numeric">
    <label class="flabel">類別</label>
    <select class="finput" id="rc">${EXP_CATS.map(c=>`<option>${c.n}</option>`).join('')}</select>
    <label class="flabel">每月幾號（1–28）</label>
    <input class="finput" type="number" id="rd" placeholder="5" min="1" max="28" inputmode="numeric">
    <button class="save-btn" onclick="saveFixed()">儲存</button>`;
  document.getElementById('ov').classList.add('show');
}

function setRT(t){
  rType=t;
  document.getElementById('rbe').className='type-btn'+(t==='expense'?' ae':'');
  document.getElementById('rbi').className='type-btn'+(t==='income'?' ai':'');
  document.getElementById('rc').innerHTML=(t==='expense'?EXP_CATS:INC_CATS).map(c=>`<option>${c.n}</option>`).join('');
}

async function saveFixed(){
  const name=document.getElementById('rn').value.trim();
  const amt=parseFloat(document.getElementById('ra').value);
  const cat=document.getElementById('rc').value;
  const day=parseInt(document.getElementById('rd').value);
  if(!name||!amt||!day){ alert('請填入所有欄位'); return; }
  const f = {name, type:rType, cat, amount:amt, day};
  try {
    const res = await api('addFixed', {fixed:f});
    f.id = res.id;
  } catch(e) { f.id = Date.now().toString(); }
  fixeds.push(f);
  localStorage.setItem('fixeds', JSON.stringify(fixeds));
  closeOv(); r3();
}

function closeOv(){ document.getElementById('ov').classList.remove('show'); }
document.getElementById('ov').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeOv(); });

// ── Init ───────────────────────────────────────
if(API_URL === 'YOUR_APPS_SCRIPT_DEPLOY_URL'){
  syncStatus('err', '尚未設定 API 網址（離線模式）');
  recs = JSON.parse(localStorage.getItem('recs_'+mk(curM))||'[]');
  fixeds = JSON.parse(localStorage.getItem('fixeds')||'[]');
  renderAll();
} else {
  loadMonth();
}
</script>
</body>
</html>
