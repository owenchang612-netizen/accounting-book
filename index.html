<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭記帳">
<meta name="theme-color" content="#ffffff">
<title>家庭記帳</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#e8f4fb;--surface:#f5faff;--border:rgba(50,102,173,0.13);
  --text1:#1a1a1a;--text2:#555;--text3:#999;
  --blue:#3266ad;--green:#3b6d11;--red:#a32d2d;
  --holiday:#fff8e6;--holiday-border:#f5a623;
  --special:#ddeeff;--special-border:#3266ad;
  --radius:12px;--safe-b:env(safe-area-inset-bottom,0px);
  --tab-bg:#dde3ec;--tab-text:#8899aa;--tab-active:#1a6fcc;--tab-active-bg:#eef5ff;
}
[data-theme="dark"]{
  --bg:#0d1f2d;--surface:#152535;--border:rgba(100,170,220,0.15);
  --text1:#f0f0f0;--text2:#99b8cc;--text3:#506070;
  --holiday:#2a1f00;--holiday-border:#f5a623;
  --special:#001a33;--special-border:#5b9bd5;
  --tab-bg:#1a3d2a;--tab-text:#88c8a0;--tab-active:#ffffff;--tab-active-bg:#256040;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1f2d;--surface:#152535;--border:rgba(100,170,220,0.15);
    --text1:#f0f0f0;--text2:#99b8cc;--text3:#506070;
    --holiday:#2a1f00;--holiday-border:#f5a623;
    --special:#001a33;--special-border:#5b9bd5;
    --tab-bg:#1a3d2a;--tab-text:#88c8a0;--tab-active:#ffffff;--tab-active-bg:#256040;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text1);max-width:430px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer}

.topbar{background:var(--surface);border-bottom:.5px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:50}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.nav-group{display:flex;align-items:center;gap:8px}
.nav-btn{background:none;border:.5px solid var(--border);border-radius:8px;padding:5px 12px;font-size:18px;color:var(--text2)}
.month-lbl{font-size:24px;font-weight:700;min-width:96px;text-align:center}
.add-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:18px;font-weight:700}
.tabs{display:flex}
.tab{flex:1;text-align:center;padding:12px 0 14px;font-size:17px;color:var(--text3);border-bottom:2px solid transparent}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.section{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--surface);border-radius:var(--radius);padding:13px 15px;border:.5px solid var(--border)}
.metric-lbl{font-size:16px;color:var(--text3);margin-bottom:6px}
.metric-val{font-size:28px;font-weight:800}
.c-inc{color:#185fa5}.c-exp{color:var(--red)}.c-pos{color:var(--green)}.c-neg{color:var(--red)}.c-n{color:var(--text1)}
.card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;border:.5px solid var(--border)}
.card-title{font-size:18px;font-weight:700;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.leg{display:flex;align-items:center;gap:5px;font-size:16px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chart-wrap{position:relative;width:100%;height:200px}
.txn-list{display:flex;flex-direction:column;gap:7px}
.txn{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius)}
.txn-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.txn-info{flex:1;min-width:0}
.txn-name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:15px;color:var(--text3);margin-top:3px}
.txn-amt{font-size:18px;font-weight:700;flex-shrink:0}
.txn-del{background:none;border:none;color:var(--text3);font-size:18px;padding:0 2px;flex-shrink:0}
.search-row{margin-bottom:10px}
.search-row input{width:100%;border:.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:18px;background:var(--surface);color:var(--text1)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:8px 16px;border:.5px solid var(--border);border-radius:20px;font-size:16px;color:var(--text2);background:none}
.chip.on{background:#e6f1fb;border-color:var(--blue);color:#0c447c;font-weight:600}
.daily-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.day-lbl{font-size:15px;color:var(--text3);width:36px;text-align:right;flex-shrink:0}
.bar-wrap{flex:1;height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-radius:4px}
.day-val{font-size:15px;color:var(--text2);width:72px;text-align:right;flex-shrink:0}
.rec-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:.5px solid var(--border)}
.rec-row:last-child{border-bottom:none}
.rec-left{display:flex;align-items:center;gap:10px}
.rec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rec-name{font-size:18px}
.rec-sub{font-size:15px;color:var(--text3);margin-top:2px}
.rec-right{display:flex;align-items:center;gap:8px}
.rec-amt{font-size:18px;font-weight:700}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.cal-hdr{font-size:15px;color:var(--text3);text-align:center;padding:4px 0;font-weight:700}
.cal-hdr.sun{color:#c0392b}.cal-hdr.sat{color:#2980b9}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;position:relative;cursor:pointer;border:.5px solid transparent;transition:background .15s}
.cal-day:hover{background:var(--bg)}
.cal-day.today{background:var(--blue)!important;color:#fff!important;font-weight:700}
.cal-day.today .cal-dot{background:#fff!important}
.cal-day.holiday{background:var(--holiday);border-color:var(--holiday-border)}
.cal-day.special{background:var(--special);border-color:var(--special-border)}
.cal-day.holiday.special{background:linear-gradient(135deg,var(--holiday) 50%,var(--special) 50%)}
.cal-day.sun-col{color:#c0392b}
.cal-day.sat-col{color:#2980b9}
.cal-day.other-m{opacity:.3}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
.cal-dot.has-txn{background:var(--blue)}
.cal-dot.holiday-dot{background:var(--holiday-border)}
.cal-dot.special-dot{background:var(--special-border)}
.cal-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:10px;padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10;margin-bottom:3px}
.cal-day:hover .cal-tooltip{opacity:1}
.cal-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.cal-leg{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--text2)}
.cal-leg-box{width:12px;height:12px;border-radius:3px;flex-shrink:0}

/* ── Special days mgmt ── */
.spec-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:.5px solid var(--border)}
.spec-item:last-child{border-bottom:none}
.spec-emoji{font-size:18px;margin-right:8px}
.spec-name{font-size:18px;font-weight:700}
.spec-date{font-size:15px;color:var(--text3);margin-top:2px}

/* ── Modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:24px;font-weight:800;margin-bottom:18px}
.close-x{float:right;background:none;border:none;font-size:22px;color:var(--text3);line-height:1;margin-top:-2px}
.type-row{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:8px;border:.5px solid var(--border);border-radius:10px;background:none;font-size:18px;color:var(--text2)}
.type-btn.ae{background:#fcebeb;border-color:var(--red);color:#791f1f;font-weight:600}
.type-btn.ai{background:#eaf3de;border-color:var(--green);color:#27500a;font-weight:600}
.flabel{font-size:17px;color:var(--text2);margin-bottom:6px;display:block;margin-top:14px}
.finput{width:100%;border:.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:20px;background:var(--surface);color:var(--text1)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.cat-btn{padding:8px 4px;border:.5px solid var(--border);border-radius:10px;background:none;font-size:15px;color:var(--text2);text-align:center;line-height:1.5}
.cat-btn.on{border-color:var(--blue);background:#e6f1fb;color:#0c447c;font-weight:600}
.save-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:21px;font-weight:800;margin-top:18px}
.ghost-btn{width:100%;padding:12px;background:var(--bg);color:var(--text1);border:.5px solid var(--border);border-radius:12px;font-size:19px;font-weight:600;margin-top:12px}
select.finput{appearance:none}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:4px}
.emoji-btn{font-size:20px;padding:6px;border:.5px solid var(--border);border-radius:8px;background:none;cursor:pointer;text-align:center}
.emoji-btn.on{border-color:var(--blue);background:#e6f1fb}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.sync-ok{background:var(--green)}.sync-err{background:var(--red)}.sync-ing{background:#f5a623;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-bar{font-size:15px;color:var(--text3);padding:4px 16px 8px;display:flex;align-items:center}
.empty{text-align:center;color:var(--text3);font-size:17px;padding:22px 0}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="nav-group">

<script>

const CAT_COLOR={
  '伙食費':'#e24b4a','買菜費用':'#ba7517','日用雜貨':'#d4537e','教育教養費':'#639922',
  '治裝費':'#7f77dd','醫療費':'#1d9e75','美髮費':'#5dcaa5','交通費':'#378add',
  '清潔費':'#888780','喜慶交際費':'#d85a30','保險費':'#0f6e56','稅金':'#533ab7','其他支出':'#3c3489',
  '薪水（夫）':'#185fa5','薪水（妻）':'#3b6d11','年終獎金':'#ba7517','其他獎金':'#854f0b',

// 台灣國定假日 2025-2027（依人事行政總處最新公告）

  '2026-02-17':'春節','2026-02-18':'春節','2026-02-19':'春節','2026-02-20':'春節',

const SPEC_EMOJIS=['🎂','💍','🎊','⭐','❤️','🌸','🎁','🏠','🐣','🌟','🎵','✈️','🍀','🌈'];

// State
let recs=[], fixeds=[], specials=JSON.parse(localStorage.getItem('specials')||'[]');
let curM=new Date(), tab=0;
let pieC=null, barC=null;
let eType='expense', eCat='', rType='expense';
let selEmoji='🎂';
let darkMode=localStorage.getItem('darkMode')==='1';
let pendingDate=null;
function applyDark(){
  document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');
  const btn=document.getElementById('darkBtn');
  if(btn)btn.textContent=darkMode?'☀️':'🌙';
}
function toggleDark(){darkMode=!darkMode;localStorage.setItem('darkMode',darkMode?'1':'0');applyDark();}

// ── API ──────────────────────────────────────
function syncStatus(s,msg){
  document.getElementById('sd').className='sync-dot sync-'+s;
  document.getElementById('st').textContent=msg;
}
async function api(action,data={}){
  const isGet=['getRecords','getFixed'].includes(action);
  const url=API_URL+'?action='+action+(isGet&&data.month?'&month='+data.month:'');
  try{
    const res=await fetch(url,{
      method:isGet?'GET':'POST',
      headers:isGet?{}:{'Content-Type':'application/json'},
      body:isGet?undefined:JSON.stringify({action,...data})
    });
    return await res.json();
  }catch(e){syncStatus('err','連線失敗，使用本機快取');throw e;}
}
async function loadMonth(){
  const m=mk(curM);
  syncStatus('ing','載入中…');
  try{
    recs=await api('getRecords',{month:m});
    fixeds=await api('getFixed');
    syncStatus('ok','已同步 Google Sheets');
  }catch(e){
    recs=JSON.parse(localStorage.getItem('recs_'+m)||'[]');
    fixeds=JSON.parse(localStorage.getItem('fixeds')||'[]');
  }
  renderAll();
}

// ── Utils ────────────────────────────────────
function mk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function fmt(n){return 'NT$'+Math.round(n).toLocaleString();}
function mRecs(){const m=mk(curM);return recs.filter(r=>String(r.date).startsWith(m));}
function pad(n){return String(n).padStart(2,'0');}
function dateStr(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function chgM(d){curM=new Date(curM.getFullYear(),curM.getMonth()+d,1);loadMonth();}

function sw(i,el){
  tab=i;
  [0,1,2,3,4,5].forEach(j=>document.getElementById('t'+j).style.display=j===i?'block':'none');
  document.querySelectorAll('.tab').forEach((t,j)=>t.className='tab'+(j===i?' on':''));
  renderAll();
}

function renderAll(){
  document.getElementById('ml').textContent=curM.getFullYear()+'年'+(curM.getMonth()+1)+'月';
  if(tab===0)r0();if(tab===1)r1();if(tab===2)r2();if(tab===3)r3();if(tab===4)r4();if(tab===5)r5();
}

function txnRow(r,showDel=false){
  const cats=r.type==='income'?INC_CATS:EXP_CATS;
  const cat=cats.find(c=>c.n===r.cat)||{e:'•'};
  const c=CAT_COLOR[r.cat]||'#888';
  const sign=r.type==='income'?'+':'-';
  const cls=r.type==='income'?'c-pos':'c-exp';
  return `<div class="txn">
    <div class="txn-ico" style="background:${c}22">${cat.e}</div>
    <div class="txn-info">
      <div class="txn-name">${r.cat}</div>
      <div class="txn-meta">${String(r.date).slice(5)} · ${r.note||'—'}</div>
    </div>
    <div class="txn-amt ${cls}">${sign}${fmt(r.amount)}</div>
    ${showDel?`<button class="txn-del" onclick="openEditRec('${r.id}')" title="編輯">✏️</button>`:''}
    ${showDel?`<button class="txn-del" onclick="doDelRec('${r.id}')">×</button>`:''}
  </div>`;
}

// ── Tab 0 Overview ───────────────────────────
function r0(){
  const rs=mRecs();
  const inc=rs.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0);
  const exp=rs.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);
  const bal=inc-exp;
  const cm={};
  rs.filter(r=>r.type==='expense').forEach(r=>{cm[r.cat]=(cm[r.cat]||0)+Number(r.amount);});
  const cats=Object.keys(cm).sort((a,b)=>cm[b]-cm[a]);
  const colors=cats.map(c=>CAT_COLOR[c]||'#888');
  const total=cats.reduce((s,c)=>s+cm[c],0);
  const recent=rs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);

  // Month specials & holidays for overview
  const m=mk(curM);
  const mo=curM.getMonth()+1, y2=curM.getFullYear();
  const daysInMo=new Date(y2,mo,0).getDate();
  const mHols=[];
  for(let d=1;d<=daysInMo;d++){
    const ds=y2+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(TW_HOLIDAYS[ds]) mHols.push({day:d,name:TW_HOLIDAYS[ds]});
  }
  const mSpec=specials.filter(s=>parseInt(s.date.slice(5,7))===mo)
    .map(s=>({...s,day:parseInt(s.date.slice(8))})).sort((a,b)=>a.day-b.day);
  const hasCalInfo=mHols.length||mSpec.length;

  document.getElementById('t0').innerHTML=`
    <div class="grid2">
      <div class="metric"><div class="metric-lbl">本月收入</div><div class="metric-val c-inc">${fmt(inc)}</div></div>
      <div class="metric"><div class="metric-lbl">本月支出</div><div class="metric-val c-exp">${fmt(exp)}</div></div>
      <div class="metric"><div class="metric-lbl">結餘</div><div class="metric-val ${bal>=0?'c-pos':'c-neg'}">${fmt(bal)}</div></div>
      <div class="metric"><div class="metric-lbl">共 ${rs.length} 筆</div><div class="metric-val c-n" style="font-size:18px">${rs.filter(r=>r.type==='income').length}收 / ${rs.filter(r=>r.type==='expense').length}支</div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 本月假日與特別日子</div>
      ${hasCalInfo?(
        mHols.map(h=>`<div class="rec-row"><div class="rec-left"><span style="font-size:24px;margin-right:10px">🎌</span><div><div class="rec-name">${h.name}</div><div class="rec-sub">${mo}月${h.day}日・國定假日</div></div></div></div>`).join('')+
        mSpec.map(s=>`<div class="rec-row"><div class="rec-left"><span style="font-size:24px;margin-right:10px">${s.emoji}</span><div><div class="rec-name">${s.name}</div><div class="rec-sub">${mo}月${s.day}日・特別日子</div></div></div></div>`).join('')
      ):'<div style="text-align:center;color:var(--text3);padding:12px 0;font-size:16px">本月無假日或特別日子</div>'}
    </div>
    <div class="card">
      <div class="card-title">支出分類</div>
      <div class="legend">${cats.map((c,i)=>`<span class="leg"><span class="leg-dot" style="background:${colors[i]}"></span>${c} ${total?Math.round(cm[c]/total*100):0}%</span>`).join('')||'<span style="color:var(--text3);font-size:12px">本月尚無支出</span>'}</div>
      <div class="chart-wrap"><canvas id="pieC" role="img" aria-label="支出圓餅圖">無資料</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">最近記錄</div>
      <div class="txn-list">${recent.length?recent.map(r=>txnRow(r)).join(''):'<div class="empty">本月尚無記錄</div>'}</div>
    </div>`;

  if(pieC)pieC.destroy();
  const ctx=document.getElementById('pieC').getContext('2d');
  if(cats.length){
    pieC=new Chart(ctx,{type:'doughnut',data:{labels:cats,datasets:[{data:cats.map(c=>cm[c]),backgroundColor:colors,borderWidth:1,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+fmt(c.raw)}}}}});
  }else{
    ctx.clearRect(0,0,300,200);
    ctx.fillStyle='#aaa';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('本月尚無支出記錄',150,105);
  }
}

// ── Tab 1 Detail ─────────────────────────────
let activeChips=[];
function r1(){
  const rs=mRecs();
  const q=document.querySelector('#srch')?.value||'';
  const allCats=[...new Set(rs.map(r=>r.cat))];
  let filtered=rs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(activeChips.length)filtered=filtered.filter(r=>activeChips.includes(r.cat));
  if(q)filtered=filtered.filter(r=>(r.note+r.cat).includes(q));
  const chips=['全部',...allCats].map(c=>{
    const on=(!activeChips.length&&c==='全部')||activeChips.includes(c);
    return `<button class="chip${on?' on':''}" onclick="togChip('${c}')">${c}</button>`;
  }).join('');
  document.getElementById('t1').innerHTML=`
    <div class="search-row"><input type="text" id="srch" placeholder="搜尋類別、備註…" oninput="r1()" value="${q}"></div>
    <div class="filter-row">${chips}</div>
    <div class="txn-list">${filtered.length?filtered.map(r=>txnRow(r,true)).join(''):'<div class="empty">無符合記錄</div>'}</div>`;
}
function togChip(c){
  if(c==='全部'){activeChips=[];}
  else{const i=activeChips.indexOf(c);if(i>=0)activeChips.splice(i,1);else activeChips.push(c);}
  r1();
}
async function doDelRec(id){
  if(!confirm('確定刪除這筆記錄？'))return;
  try{await api('delRecord',{id});}catch(e){}
  recs=recs.filter(r=>String(r.id)!==String(id));
  r1();
}

// ── Tab 2 Trend ──────────────────────────────
let trendMode = 'daily'; // 'daily' | 'monthly' | 'yearly'

function r2(){
  if(trendMode==='daily') r2Daily();
  else if(trendMode==='monthly') r2Monthly();
  else r2Yearly();
}

function trendToggleHTML(){
  const modes=[['daily','每日'],['monthly','每月'],['yearly','每年']];
  return `<div style="display:flex;gap:0;margin-bottom:12px;border:.5px solid var(--border);border-radius:10px;overflow:hidden">
    ${modes.map(([v,l])=>`<button onclick="trendMode='${v}';r2()" style="flex:1;padding:9px 0;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;background:${trendMode===v?'var(--blue)':'var(--surface)'};color:${trendMode===v?'#fff':'var(--text2)'}">${l}收支</button>`).join('')}
  </div>`;
}

function r2Daily(){
  const rs=mRecs();
  const days=new Date(curM.getFullYear(),curM.getMonth()+1,0).getDate();
  const dayE=Array(days).fill(0),dayI=Array(days).fill(0);
  rs.forEach(r=>{
    const d=parseInt(String(r.date).split('-')[2])-1;
    if(d>=0&&d<days){if(r.type==='expense')dayE[d]+=Number(r.amount);else dayI[d]+=Number(r.amount);}
  });
  const maxE=Math.max(...dayE,1);
  const rows=dayE.map((v,i)=>({v,inc:dayI[i],i})).filter(x=>x.v>0||x.inc>0);
  document.getElementById('t2').innerHTML=`
    ${trendToggleHTML()}
    <div class="card">
      <div class="card-title">每日收支圖</div>
      <div style="display:flex;gap:14px;margin-bottom:8px;font-size:13px;color:var(--text2)">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#e24b4a;margin-right:4px"></span>支出</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b6d11;margin-right:4px"></span>收入</span>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="barC" role="img" aria-label="每日收支圖">收支圖</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">有消費的日子</div>
      ${rows.length?rows.map(x=>`
        <div class="daily-row">
          <span class="day-lbl">${x.i+1}日</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(x.v/maxE*100)}%"></div></div>
          <span class="day-val">${x.v?fmt(x.v):''}</span>
        </div>`).join(''):'<div class="empty">本月尚無資料</div>'}
    </div>`;
  if(barC)barC.destroy();
  const ctx=document.getElementById('barC').getContext('2d');
  barC=new Chart(ctx,{type:'bar',data:{labels:Array.from({length:days},(_,i)=>i+1+''),datasets:[
    {label:'支出',data:dayE,backgroundColor:'#e24b4a88',borderColor:'#e24b4a',borderWidth:1},
    {label:'收入',data:dayI,backgroundColor:'#3b6d1188',borderColor:'#3b6d11',borderWidth:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},scales:{x:{ticks:{autoSkip:true,maxRotation:0,font:{size:9}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k'}}}}});
}

function r2Monthly(){
  // Build last 12 months data from all cached records
  const months=[];
  for(let i=11;i>=0;i--){
    const d=new Date(curM.getFullYear(),curM.getMonth()-i,1);
    months.push({key:mk(d),lbl:(d.getMonth()+1)+'月',inc:0,exp:0});
  }
  // gather all stored records across months
  months.forEach(m=>{
    const stored=JSON.parse(localStorage.getItem('recs_'+m.key)||'[]');
    stored.forEach(r=>{
      if(r.type==='income') m.inc+=Number(r.amount);
      else m.exp+=Number(r.amount);
    });
  });
  // also count current loaded recs
  const cm=mk(curM);
  const cur=months.find(m=>m.key===cm);
  if(cur){
    cur.inc=0;cur.exp=0;
    recs.forEach(r=>{if(r.type==='income')cur.inc+=Number(r.amount);else cur.exp+=Number(r.amount);});
  }

  const labels=months.map(m=>m.lbl);
  const expData=months.map(m=>m.exp);
  const incData=months.map(m=>m.inc);
  const balData=months.map(m=>m.inc-m.exp);

  document.getElementById('t2').innerHTML=`
    ${trendToggleHTML()}
    <div class="card">
      <div class="card-title">近12個月收支趨勢</div>
      <div style="display:flex;gap:14px;margin-bottom:8px;font-size:13px;color:var(--text2)">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#e24b4a;margin-right:4px"></span>支出</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b6d11;margin-right:4px"></span>收入</span>
      </div>
      <div class="chart-wrap" style="height:240px"><canvas id="barC" role="img" aria-label="每月收支趨勢圖">月趨勢</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">各月結餘一覽</div>
      ${months.filter(m=>m.inc||m.exp).map(m=>{
        const bal=m.inc-m.exp;
        const maxAmt=Math.max(...months.map(x=>x.exp),1);
        return `<div class="daily-row">
          <span class="day-lbl" style="width:36px">${m.lbl}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(m.exp/maxAmt*100)}%;background:${bal>=0?`var(--blue)`:`#e24b4a`}"></div></div>
          <span class="day-val" style="width:80px;color:${bal>=0?`var(--green)`:`var(--red)`}">${bal>=0?'+':''}${fmt(bal)}</span>
        </div>`;
      }).join('')||'<div class="empty">尚無歷史資料</div>'}
    </div>`;
  if(barC)barC.destroy();
  const ctx=document.getElementById('barC').getContext('2d');
  barC=new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'支出',data:expData,backgroundColor:'#e24b4a88',borderColor:'#e24b4a',borderWidth:1},
    {label:'收入',data:incData,backgroundColor:'#3b6d1188',borderColor:'#3b6d11',borderWidth:1},
    {label:'結餘',data:balData,type:'line',borderColor:'#3266ad',borderWidth:2,pointRadius:3,pointBackgroundColor:'#3266ad',fill:false,tension:0.3,yAxisID:'y'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},scales:{x:{ticks:{font:{size:11}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k'}}}}});
}

function r2Yearly(){
  // gather all years from localStorage keys
  const allKeys=Object.keys(localStorage).filter(k=>k.startsWith('recs_'));
  const yearMap={};
  allKeys.forEach(k=>{
    const yr=k.replace('recs_','').slice(0,4);
    if(!yearMap[yr])yearMap[yr]={inc:0,exp:0};
    const rs=JSON.parse(localStorage.getItem(k)||'[]');
    rs.forEach(r=>{if(r.type==='income')yearMap[yr].inc+=Number(r.amount);else yearMap[yr].exp+=Number(r.amount);});
  });
  // also include current loaded recs
  const cy=String(curM.getFullYear());
  if(!yearMap[cy])yearMap[cy]={inc:0,exp:0};
  yearMap[cy].inc=0;yearMap[cy].exp=0;
  recs.forEach(r=>{if(r.type==='income')yearMap[cy].inc+=Number(r.amount);else yearMap[cy].exp+=Number(r.amount);});

  const years=Object.keys(yearMap).sort();
  const expData=years.map(y=>yearMap[y].exp);
  const incData=years.map(y=>yearMap[y].inc);
  const balData=years.map(y=>yearMap[y].inc-yearMap[y].exp);

  document.getElementById('t2').innerHTML=`
    ${trendToggleHTML()}
    <div class="card">
      <div class="card-title">年度收支趨勢</div>
      <div style="display:flex;gap:14px;margin-bottom:8px;font-size:13px;color:var(--text2)">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#e24b4a;margin-right:4px"></span>支出</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b6d11;margin-right:4px"></span>收入</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3266ad;margin-right:4px"></span>結餘</span>
      </div>
      <div class="chart-wrap" style="height:240px"><canvas id="barC" role="img" aria-label="年度收支圖">年度趨勢</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">各年結餘一覽</div>
      ${years.length?years.map(y=>{
        const bal=yearMap[y].inc-yearMap[y].exp;
        const maxE=Math.max(...expData,1);
        return `<div class="daily-row">
          <span class="day-lbl" style="width:44px;font-size:12px">${y}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(yearMap[y].exp/maxE*100)}%;background:${bal>=0?`var(--blue)`:`#e24b4a`}"></div></div>
          <span class="day-val" style="width:90px;color:${bal>=0?`var(--green)`:`var(--red)`}">${bal>=0?'+':''}${fmt(bal)}</span>
        </div>`;
      }).join(''):'<div class="empty">尚無年度資料</div>'}
    </div>`;
  if(barC)barC.destroy();
  const ctx=document.getElementById('barC').getContext('2d');
  barC=new Chart(ctx,{type:'bar',data:{labels:years,datasets:[
    {label:'支出',data:expData,backgroundColor:'#e24b4a88',borderColor:'#e24b4a',borderWidth:1},
    {label:'收入',data:incData,backgroundColor:'#3b6d1188',borderColor:'#3b6d11',borderWidth:1},
    {label:'結餘',data:balData,type:'line',borderColor:'#3266ad',borderWidth:2,pointRadius:4,pointBackgroundColor:'#3266ad',fill:false,tension:0.3}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},scales:{x:{ticks:{font:{size:12}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k'}}}}});
}

      <div class="card-title">固定收支項目</div>

async function doDelFixed(id){
  if(!confirm('確定刪除？'))return;
  try{await api('delFixed',{id});}catch(e){}
  fixeds=fixeds.filter(f=>String(f.id)!==String(id));

function buildSpecList(){
  if(!specials.length) return '<div class="empty">尚未新增特別日子</div>';
  return specials.slice().sort((a,b)=>a.date.slice(5).localeCompare(b.date.slice(5))).map(function(s){
    const mo2=parseInt(s.date.slice(5,7)), dy2=parseInt(s.date.slice(8));
    return '<div class="spec-item">'
      +'<div style="display:flex;align-items:center">'
      +'<span style="font-size:28px;margin-right:12px">'+s.emoji+'</span>'
      +'<div><div class="spec-name">'+s.name+'</div>'
      +'<div class="spec-date">每年 '+mo2+'月'+dy2+'日</div></div></div>'
      +'<button class="txn-del" style="font-size:22px" data-id="'+s.id+'" onclick="delSpec(this.dataset.id)">×</button>'
      +'</div>';
  }).join('');
}

// ── Tab 4 Calendar ───────────────────────────
function r4(){
  const y=curM.getFullYear(), m=curM.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const totalDays=new Date(y,m+1,0).getDate();
  const today=new Date();
  const todayStr=dateStr(today.getFullYear(),today.getMonth()+1,today.getDate());
  const rs=mRecs();

  // build day→amounts map
  const dayMap={};
  rs.forEach(r=>{const d=String(r.date);dayMap[d]=(dayMap[d]||0)+(r.type==='expense'?-1:1)*Number(r.amount);});

  // specials map (MM-DD → item)
  const specMap={};
  specials.forEach(s=>{specMap[s.date.slice(5)]=s;});

  const hdrs=['日','一','二','三','四','五','六'].map((h,i)=>
    `<div class="cal-hdr ${i===0?'sun':i===6?'sat':''}">${h}</div>`).join('');

  let cells='';
  // blank cells before first day
  for(let i=0;i<firstDay;i++) cells+=`<div class="cal-day other-m"></div>`;

  for(let d=1;d<=totalDays;d++){
    const ds=dateStr(y,m+1,d);
    const md=pad(m+1)+'-'+pad(d);
    const dow=new Date(y,m,d).getDay();
    const isToday=ds===todayStr;
    const isHol=!!TW_HOLIDAYS[ds];
    const isSpec=!!specMap[md];
    const hasTxn=!!dayMap[ds];
    const holName=TW_HOLIDAYS[ds]||'';
    const specItem=specMap[md];
    const tooltip=isToday?'今天':[holName,specItem?(specItem.emoji+' '+specItem.name):''].filter(Boolean).join(' · ');

    let cls='cal-day';
    if(isToday)cls+=' today';
    else if(isHol&&isSpec)cls+=' holiday special';
    else if(isHol)cls+=' holiday';
    else if(isSpec)cls+=' special';
    if(dow===0)cls+=' sun-col';
    if(dow===6)cls+=' sat-col';

    let dot='';
    if(isHol&&!isToday)dot=`<span class="cal-dot holiday-dot"></span>`;
    else if(isSpec&&!isToday)dot=`<span class="cal-dot special-dot"></span>`;
    else if(hasTxn&&!isToday)dot=`<span class="cal-dot has-txn"></span>`;

    cells+=`<div class="${cls}" onclick="openDayDetail('${ds}')">
      ${d}
      ${dot}
      ${tooltip?`<div class="cal-tooltip">${tooltip}</div>`:''}
    </div>`;
  }

  document.getElementById('t4').innerHTML=`
    <div class="card">
      <div class="card-title">
        月曆

function openDayDetail(ds){
  const md=ds.slice(5);
  const holName=TW_HOLIDAYS[ds];
  const specItems=specials.filter(s=>s.date.slice(5)===md);

  if(!holName && specItems.length===0){
    pendingDate=ds; openAdd(); return;
  }

  const parts=ds.split('-');
  let html='<button class="close-x" onclick="closeOv()">×</button>';
  html+='<div class="modal-title">'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日</div>';
  if(holName){
    html+='<div style="background:var(--holiday);border:2px solid var(--holiday-border);border-radius:14px;padding:18px;margin-bottom:12px">';
    html+='<div style="font-size:15px;color:#885500;margin-bottom:8px;font-weight:700;letter-spacing:.5px">🎌 國定假日</div>';
    html+='<div style="font-size:26px;font-weight:800;color:#663300">'+holName+'</div>';
    html+='</div>';
  }
  specItems.forEach(function(s){
    html+='<div style="background:var(--special);border:2px solid var(--special-border);border-radius:14px;padding:18px;margin-bottom:12px">';
    html+='<div style="font-size:15px;color:#1a5fa5;margin-bottom:8px;font-weight:700;letter-spacing:.5px">✨ 特別日子</div>';
    html+='<div style="font-size:26px;font-weight:800;color:#0c3a7c">'+s.emoji+' '+s.name+'</div>';
    html+='</div>';
  });
  html+='<button class="save-btn" style="margin-top:10px" onclick="setPendingDate(this)">＋ 新增當日記錄</button>';
  document.getElementById('mbox').dataset.date=ds;
  document.getElementById('mbox').innerHTML=html;
  document.getElementById('ov').classList.add('show');
}

// ── Special days ─────────────────────────────
function openSpecModal(){
  selEmoji='🎂';
  document.getElementById('mbox').innerHTML=`
    <button class="close-x" onclick="closeOv()">×</button>
    <div class="modal-title">新增特別日子</div>
    <label class="flabel">名稱（如：結婚紀念日）</label>
    <input class="finput" type="text" id="sn" placeholder="例：老婆生日">
    <label class="flabel">日期（每年重複）</label>
    <input class="finput" type="date" id="sd2">
    <label class="flabel">選擇圖示</label>
    <div class="emoji-grid" id="eg">

    </div>
    <button class="save-btn" onclick="saveSpec()">儲存</button>`;
  document.getElementById('ov').classList.add('show');

function pickEmoji(e){
  selEmoji=e;
  document.querySelectorAll('.emoji-btn').forEach(b=>b.classList.toggle('on',b.textContent===e));
}

function saveSpec(){
  const name=document.getElementById('sn').value.trim();
  const date=document.getElementById('sd2').value;
  if(!name||!date){alert('請填入名稱和日期');return;}
  specials.push({id:Date.now(),name,date,emoji:selEmoji});
  localStorage.setItem('specials',JSON.stringify(specials));
  closeOv();r4();
}

function delSpec(id){
  if(!confirm('確定刪除？'))return;
  specials=specials.filter(s=>s.id!==id);
  localStorage.setItem('specials',JSON.stringify(specials));
  r4();
}

// ── Add Record ───────────────────────────────
function openAdd(){
  eType='expense';eCat='';
  const today=pendingDate||new Date().toISOString().split('T')[0];
  pendingDate=null;
  const html='<button class="close-x" onclick="closeOv()">×</button>'
    +'<div class="modal-title">新增記錄</div>'
    +'<div class="type-row">'
    +'<button class="type-btn ae" id="be" onclick="setET(&quot;expense&quot;)">支出</button>'
    +'<button class="type-btn" id="bi" onclick="setET(&quot;income&quot;)">收入</button>'
    +'</div>'
    +'<label class="flabel">金額（NT$）</label>'
    +'<input class="finput" type="number" id="fa" placeholder="0" min="0" inputmode="numeric">'
    +'<label class="flabel">類別</label>'
    +'<div class="cat-grid" id="cg"></div>'
    +'<label class="flabel">日期</label>'
    +'<input class="finput" type="date" id="fd" value="'+today+'">'
    +'<label class="flabel">備註（可加 #標籤）</label>'
    +'<input class="finput" type="text" id="fn" placeholder="例：午餐 #外食">'
    +'<button class="save-btn" onclick="saveRec()">儲存</button>';
  document.getElementById('mbox').innerHTML=html;
  document.getElementById('cg').innerHTML=buildCatBtns('expense');
  document.getElementById('ov').classList.add('show');
}
function buildCatBtns(type){
  return (type==='expense'?EXP_CATS:INC_CATS).map(c=>
    `<button class="cat-btn${c.n===eCat?' on':''}" onclick="pickCat('${c.n}')">${c.e}<br>${c.n}</button>`
  ).join('');
}
function setET(t){
  eType=t;eCat='';
  document.getElementById('be').className='type-btn'+(t==='expense'?' ae':'');
  document.getElementById('bi').className='type-btn'+(t==='income'?' ai':'');
  document.getElementById('cg').innerHTML=buildCatBtns(t);
}
function pickCat(n){eCat=n;document.getElementById('cg').innerHTML=buildCatBtns(eType);}

let editRecId=null;
function openEditRec(id){
  const r=recs.find(x=>String(x.id)===String(id));
  if(!r)return;
  editRecId=id;
  eType=r.type;eCat=r.cat;
  const html='<button class="close-x" onclick="closeOv()">×</button>'
    +'<div class="modal-title">編輯記錄</div>'
    +'<div class="type-row">'
    +'<button class="type-btn '+(r.type==='expense'?'ae':'')+'" id="be" onclick="setET(&quot;expense&quot;)">支出</button>'
    +'<button class="type-btn '+(r.type==='income'?'ai':'')+'" id="bi" onclick="setET(&quot;income&quot;)">收入</button>'
    +'</div>'
    +'<label class="flabel">金額（NT$）</label>'
    +'<input class="finput" type="number" id="fa" value="'+r.amount+'" inputmode="numeric">'
    +'<label class="flabel">類別</label>'
    +'<div class="cat-grid" id="cg"></div>'
    +'<label class="flabel">日期</label>'
    +'<input class="finput" type="date" id="fd" value="'+r.date+'">'
    +'<label class="flabel">備註</label>'
    +'<input class="finput" type="text" id="fn" value="'+(r.note||'')+'">'
    +'<button class="save-btn" onclick="saveEdit()">儲存修改</button>';
  document.getElementById('mbox').innerHTML=html;
  document.getElementById('cg').innerHTML=buildCatBtns(r.type);
  document.getElementById('ov').classList.add('show');
}

async function saveEdit(){
  const amt=parseFloat(document.getElementById('fa').value);
  const date=document.getElementById('fd').value;
  const note=document.getElementById('fn').value.trim();
  if(!amt||!date||!eCat){alert('請填入金額、日期並選擇類別');return;}
  // delete old + add new
  try{await api('delRecord',{id:editRecId});}catch(e){}
  const rec={date,type:eType,cat:eCat,amount:amt,note};
  try{const res=await api('addRecord',{record:rec});rec.id=res.id;}catch(e){rec.id=Date.now().toString();}
  recs=recs.filter(r=>String(r.id)!==String(editRecId));
  recs.push(rec);
  localStorage.setItem('recs_'+mk(curM),JSON.stringify(recs));
  editRecId=null;
  closeOv();renderAll();
}

async function saveRec(){
  const amt=parseFloat(document.getElementById('fa').value);
  const date=document.getElementById('fd').value;
  const note=document.getElementById('fn').value.trim();
  if(!amt||!date||!eCat){alert('請填入金額、日期並選擇類別');return;}
  const rec={date,type:eType,cat:eCat,amount:amt,note};
  syncStatus('ing','儲存中…');
  try{
    const res=await api('addRecord',{record:rec});
    rec.id=res.id;
    syncStatus('ok','已同步 Google Sheets');
  }catch(e){rec.id=Date.now().toString();syncStatus('err','已存本機');}
  const m=mk(curM);
  if(String(rec.date).startsWith(m))recs.unshift(rec);
  localStorage.setItem('recs_'+m,JSON.stringify(recs));
  closeOv();renderAll();
}

// ── CSV Export ───────────────────────────────
function exportCSV(){
  // gather all records from all months in localStorage
  const allRecs=[];
  Object.keys(localStorage).filter(k=>k.startsWith('recs_')).forEach(k=>{
    const rs=JSON.parse(localStorage.getItem(k)||'[]');
    allRecs.push(...rs);
  });
  // also add current
  recs.forEach(r=>{if(!allRecs.find(x=>String(x.id)===String(r.id)))allRecs.push(r);});
  allRecs.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

  const header='日期,類型,類別,金額,備註';
  const rows=allRecs.map(r=>[
    r.date,
    r.type==='income'?'收入':'支出',
    r.cat,
    r.amount,
    '"'+(r.note||'').replace(/"/g,'""')+'"'
  ].join(','));
  const csv='\uFEFF'+header+'\n'+rows.join('\n'); // BOM for Excel
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`記帳_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── Annual Report Tab ─────────────────────────
function r5(){
  const y=curM.getFullYear();
  // gather all months of this year
  const yearRecs=[];
  for(let m=1;m<=12;m++){
    const key=y+'-'+String(m).padStart(2,'0');
    const rs=JSON.parse(localStorage.getItem('recs_'+key)||'[]');
    yearRecs.push(...rs);
  }
  // merge current loaded recs
  const cm=mk(curM);
  if(cm.startsWith(String(y))){
    recs.forEach(r=>{if(!yearRecs.find(x=>String(x.id)===String(r.id)))yearRecs.push(r);});
  }

  const inc=yearRecs.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0);
  const exp=yearRecs.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);

  // monthly breakdown
  const mData=[];
  for(let m=1;m<=12;m++){
    const key=y+'-'+String(m).padStart(2,'0');
    const rs=yearRecs.filter(r=>String(r.date).startsWith(key));
    mData.push({m,inc:rs.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0),
      exp:rs.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0)});
  }

  // category breakdown
  const catExp={};
  yearRecs.filter(r=>r.type==='expense').forEach(r=>{catExp[r.cat]=(catExp[r.cat]||0)+Number(r.amount);});
  const topCats=Object.entries(catExp).sort((a,b)=>b[1]-a[1]);

  document.getElementById('t5').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:18px;font-weight:700">${y} 年度報表</div>
      <button onclick="exportCSV()" style="background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer">📥 匯出 CSV</button>
    </div>
    <div class="grid2">
      <div class="metric"><div class="metric-lbl">年度收入</div><div class="metric-val c-inc">${fmt(inc)}</div></div>
      <div class="metric"><div class="metric-lbl">年度支出</div><div class="metric-val c-exp">${fmt(exp)}</div></div>
      <div class="metric"><div class="metric-lbl">年度結餘</div><div class="metric-val ${inc-exp>=0?'c-pos':'c-neg'}">${fmt(inc-exp)}</div></div>
      <div class="metric"><div class="metric-lbl">總筆數</div><div class="metric-val c-n" style="font-size:16px">${yearRecs.length} 筆</div></div>
    </div>
    <div class="card">
      <div class="card-title">各月支出比較</div>
      <div class="chart-wrap" style="height:200px"><canvas id="yearBarC" role="img" aria-label="年度月份支出圖">年度月支出</canvas></div>
    </div>
    <div class="card">
      <div class="card-title">年度支出分類排行</div>
      ${topCats.length?topCats.map(([cat,amt],i)=>{
        const pct=exp?Math.round(amt/exp*100):0;
        const c=CAT_COLOR[cat]||'#888';
        return `<div class="daily-row" style="margin-bottom:10px">
          <span style="font-size:13px;width:80px;flex-shrink:0;color:var(--text1)">${i+1}. ${cat}</span>
          <div class="bar-wrap" style="height:16px"><div class="bar-fill" style="width:${pct}%;background:${c}"></div></div>
          <span style="font-size:13px;width:100px;text-align:right;flex-shrink:0;color:${c};font-weight:600">${fmt(amt)} (${pct}%)</span>
        </div>`;
      }).join(''):'<div class="empty">本年無支出記錄</div>'}
    </div>
    <div class="card">
      <div class="card-title">各月收支明細</div>
      ${mData.filter(m=>m.inc||m.exp).map(m=>`
        <div class="rec-row">
          <div style="font-size:14px;font-weight:600;width:40px">${m.m}月</div>
          <div style="flex:1;font-size:13px;color:var(--text2)">
            <span style="color:var(--green)">+${fmt(m.inc)}</span>
            <span style="margin:0 6px;color:var(--text3)">|</span>
            <span style="color:var(--red)">-${fmt(m.exp)}</span>
          </div>
          <div style="font-size:13px;font-weight:700;color:${m.inc-m.exp>=0?'var(--green)':'var(--red)'}">${m.inc-m.exp>=0?'+':''}${fmt(m.inc-m.exp)}</div>
        </div>`).join('')||'<div class="empty">本年無資料</div>'}
    </div>`;

  // draw chart
  setTimeout(()=>{
    const ctx=document.getElementById('yearBarC')?.getContext('2d');
    if(!ctx)return;
    new Chart(ctx,{type:'bar',data:{
      labels:mData.map(m=>m.m+'月'),
      datasets:[
        {label:'支出',data:mData.map(m=>m.exp),backgroundColor:'#e24b4a88',borderColor:'#e24b4a',borderWidth:1},
        {label:'收入',data:mData.map(m=>m.inc),backgroundColor:'#3b6d1188',borderColor:'#3b6d11',borderWidth:1}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'k'}}}}});
  },50);
}

function openFixed(){

async function saveFixed(){
  const name=document.getElementById('rn').value.trim();
  const amt=parseFloat(document.getElementById('ra').value);
  const cat=document.getElementById('rc').value;
  const day=parseInt(document.getElementById('rd').value);

  try{const res=await api('addFixed',{fixed:f});f.id=res.id;}catch(e){f.id=Date.now().toString();}
  fixeds.push(f);
  localStorage.setItem('fixeds',JSON.stringify(fixeds));
  closeOv();r3();

function setPendingDate(btn){
  const ds=btn.closest('.modal').dataset.date||'';
  pendingDate=ds||null;
  closeOv();
  setTimeout(openAdd,100);
}
function closeOv(){document.getElementById('ov').classList.remove('show');}
document.getElementById('ov').addEventListener('click',e=>{if(e.target===e.currentTarget)closeOv();});

applyDark();
